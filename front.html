<!DOCTYPE HTML>
<html>
<head>
    <title>Expence Tracker with chart</title>
    <link rel="stylesheet"href="front1.css">
</head>
<body>
  <div class="main-box">
    <h1>Expense Tracker With Chart</h1>
    <div class="wrapper">
    <div class="container">    
    <input type="text" id="title" placeholder="Expense title">
    <input type="number" id="amount" placeholder="Amount">
    <button onclick="addExpense()">Add</button>
    <button onclick="clearAll()">Clear All</button>
    <ul id="list"></ul>
    <h3>Total:₹<span id="total">0</span></h3>
    <input type="text" id="search" placeholder="Search..." onkeyup="searchExpense()">
    <p id="notFound" style="display:none; color:red;">Search not found</p>
    </div>
  <div class="chart-container">
    <canvas id="myChart"  width="1000" height="400"></canvas>
  </div>
    </div>
    </div>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="script.js"></script>
</body>
</html>
